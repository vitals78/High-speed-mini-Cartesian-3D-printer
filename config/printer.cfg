[include mainsail.cfg]
[include Macro.cfg]
[include Start_Stop.cfg]
[include klicky-probe.cfg]
[include Exclude_Object.cfg]
[display_status]
[exclude_object]
#[include btt-adxl345.cfg]
[virtual_sdcard]
path: ~/printer_data/gcodes
[pause_resume]
recover_velocity: 80

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_2000220004504E5238363120-if00

[mcu rpi]
serial: /tmp/klipper_host_mcu



[printer]
kinematics: cartesian
max_velocity: 1000
max_accel: 25000           
minimum_cruise_ratio: 0.5
max_z_velocity: 20
max_z_accel: 1000
square_corner_velocity: 20.0




[stepper_x]  
step_pin: PC8
dir_pin: PC9 
enable_pin: !PA15
endstop_pin: PD3
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 39.96
position_endstop: -1.0      
position_min: -1.1          
position_max: 118
homing_speed: 15
homing_retract_dist: 0


#[motor_constants my_stepper_x]
#resistance: 2.0
#inductance: 3.3
#steps_per_revolution: 200
#holding_torque: 0.35
#max_current: 1.2

[tmc2240 stepper_x]
cs_pin: PD9
spi_software_sclk_pin: PB13
spi_software_mosi_pin: PB15
spi_software_miso_pin: PB14
run_current: 1.2
interpolate: false
stealthchop_threshold: 0

#[autotune_tmc stepper_x]
#motor: my_stepper_x
#tuning_goal: performance 




[stepper_y]   
step_pin: PA10
dir_pin: !PA14
enable_pin: !PA13
endstop_pin: PD2
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 40.03
position_endstop: -4.0      
position_min: -4.1          
position_max: 118
homing_speed: 15
homing_retract_dist: 0


#[motor_constants my_stepper_y]
#resistance: 2.1
#inductance: 3.2
#steps_per_revolution: 200
#holding_torque: 0.45
#max_current: 1.6

[tmc2240 stepper_y]
cs_pin: PD8
spi_software_sclk_pin: PB13
spi_software_mosi_pin: PB15
spi_software_miso_pin: PB14
run_current: 1.6
interpolate: false
stealthchop_threshold: 0

#[autotune_tmc stepper_y]
#motor: my_stepper_y
#tuning_goal: performance 




[stepper_z]   
step_pin: PC6
dir_pin: PC7
enable_pin: !PA9
endstop_pin: PC3
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 42.65
gear_ratio: 80:15
#position_endstop: 0.0
position_min: -0.1
position_max: 125
homing_speed: 2
second_homing_speed: 0.2
homing_retract_dist: 0.6

[tmc2240 stepper_z]
cs_pin: PB10
spi_software_sclk_pin: PB13
spi_software_mosi_pin: PB15
spi_software_miso_pin: PB14
run_current: 1.5
interpolate: false
stealthchop_threshold: 999999


[extruder]
step_pin: PB12
dir_pin: !PB11
enable_pin: !PA8
microsteps: 16
rotation_distance: 22.2
Gear_ratio: 50:10
nozzle_diameter: 0.4
filament_diameter: 1.750

heater_pin: PC5
sensor_type: PT1000
pullup_resistor: 2200
sensor_pin: PA1

#control: pid
#pid_Kp: 28.737 
#pid_Ki: 1.935 
#pid_Kd: 106.684
min_temp: 10
max_temp: 300
full_steps_per_rotation: 200
max_extrude_only_distance: 150.0
max_extrude_cross_section: 500
max_extrude_only_velocity: 200
max_extrude_only_accel: 10000
min_extrude_temp: 15
pressure_advance: 0
pressure_advance_smooth_time: 0.03

[tmc2240 extruder]
cs_pin: PB2
spi_software_sclk_pin: PB13
spi_software_mosi_pin: PB15
spi_software_miso_pin: PB14
run_current: 0.7
interpolate: false
stealthchop_threshold: 0


[heater_bed]
heater_pin: PA7
sensor_type: Generic 3950
sensor_pin: PA2
#control: pid
#pid_Kp: 66.746
#pid_Ki: 3.504
#pid_Kd: 317.878
min_temp: 10
max_temp: 120


[probe]
pin: PC13
x_offset: 0
y_offset: 17.5
#z_offset: 11
speed: 1.0
samples: 2
sample_retract_dist: 1.0
lift_speed: 1
samples_result: average
samples_tolerance: 0.100

[servo dock]
pin: PC15
maximum_servo_angle: 180
minimum_pulse_width: 0.0005
maximum_pulse_width: 0.0025
initial_angle: 65

[bed_mesh]
speed: 100
horizontal_move_z: 13
mesh_min: 18, 18
mesh_max: 100, 100
probe_count: 3,3
fade_start: 1.0
fade_end: 10.0
fade_target: 0.0
algorithm: bicubic
zero_reference_position: 58, 58

[bed_screws]
screw1: 9, 9
screw2: 109, 9
screw3: 109, 109
screw4: 9, 109
speed: 5
horizontal_move_z: 20
probe_speed: 1

[screws_tilt_adjust]
screw1: 9, -4      
screw2: 109, -4  
screw3: 109, 91.5   
screw4: 9, 91.5 
horizontal_move_z: 13
speed: 100
screw_thread: CW-M4


###5015###
#[fan]
#pin: PA4
#max_power: 1.0
#cycle_time: 0.1
#hardware_pwm: false
#shutdown_speed: 0

[heater_fan hotend_fan]
pin: PA3
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0

[fan]
pin: rpi:gpio25
max_power: 1
cycle_time: 0.005
hardware_pwm: false
shutdown_speed: 0
off_below: 0.0


[idle_timeout]
timeout: 1800
gcode =
  {% if printer.pause_resume.is_paused %}
    M104 S0
  {% else %}
    TURN_OFF_HEATERS
    #M84
  {% endif %}


[input_shaper]
shaper_freq_x: 85.6
shaper_type: mzv
shaper_freq_y: 87.0
shaper_type: mzv


[gcode_arcs]
resolution: 0.1

[include shell_command.cfg]

